version: 1
status: OBSERVABILITY_REGISTRY_READY_PLANNING_ONLY
does_not_execute_inference: true
does_not_create_optimized_inference_v1: true
does_not_mutate_main_inference_v1: true
readiness_states:
- future_architecture
- ready_derivable
- ready_existing
- requires_engine_metrics
- requires_external_profiler
- requires_runner_instrumentation
- unsupported_current_runtime
measurement_types:
- derived
- engine_reported
- estimated
- measured
- unavailable
optimization_domains:
- cache_offloading
- disaggregation
- distributed_serving
- kernel_compiler
- kv_cache
- model_compression
- model_selection
- parallelism
- prefill_decode_balance
- prefix_cache
- prompt_workload
- quantization
- routing
- scheduler_batching
- speculative_decoding
measurement_semantics:
  measured: Captured from saved run, engine, evaluator, or telemetry artifacts.
  engine_reported: Reported directly by a serving engine metrics endpoint or log.
  derived: Calculated from measured fields without inventing missing counters.
  estimated: Planning estimate from static analysis or formulas; not measured telemetry.
  unavailable: Not captured and not derivable from current artifacts.
metric_envelopes:
  run_identity:
    description: Stable run and scenario identity fields.
    fields:
    - run_id
    - parent_run_id
    - scenario_id
    - optimization_id
    - changed_factor
    - held_constants
    - model
    - engine
    - backend
    - memory_mode
    - concurrency
    - hardware
    - precision
    - git_commit
    - config_hash
    - workload_hash
    - start_time
    - end_time
    - status
  request_lifecycle:
    description: Nullable per-request timing events; runtimes emit only what they
      expose.
    fields:
    - request_id
    - prompt_id
    - config_id
    - arrival_time
    - queue_enter_time
    - scheduling_time
    - prefill_start
    - prefill_end
    - first_token_time
    - decode_start
    - decode_end
    - completion_time
    - failure_retry_status
    - input_tokens
    - output_tokens
    - total_tokens
  performance:
    description: Latency, queueing, throughput, and batch efficiency metrics.
    fields:
    - ttft_ms
    - queue_wait_ms
    - prefill_latency_ms
    - tpot_ms
    - itl_ms
    - e2e_latency_ms
    - requests_per_second
    - tokens_per_second
    - successful_requests_per_second
    - batch_level_throughput
  resources:
    description: GPU/CPU/RAM/power/process resource telemetry.
    fields:
    - gpu_utilization_percent
    - vram_used_mb
    - vram_available_mb
    - power_draw_w
    - temperature_c
    - cpu_utilization_percent
    - ram_usage_gb
    - model_memory_mb
    - kv_cache_memory_mb
    - telemetry_timestamp
    - active_engine_process
  quality_safety_protection:
    description: Protected answer-quality and safety gates.
    fields:
    - json_validity
    - contract_validity
    - format_validity
    - evidence_id_presence
    - evidence_match
    - groundedness
    - safety_findings
    - truncation
    - completion_failure_rate
    - escalation_correctness
    - insufficient_evidence_correctness
    - mm4_bound_compliance
  cost:
    description: GPU/API/total cost and normalized economics.
    fields:
    - gpu_cost_usd
    - api_cost_usd
    - total_cost_usd
    - cost_per_request_usd
    - cost_per_1000_requests_usd
    - cost_per_successful_request_usd
    - tokens_per_gpu_dollar
    - tokens_per_api_dollar
optimizations:
- optimization_id: cache_workload_aware_routing
  display_name: Cache-aware/workload-aware routing
  optimization_domain: routing
  difficulty_tier: 1
  problem_statement: Requests are not yet routed by cache affinity or workload shape.
  mechanism: Improve cache locality and reduce mixed-length interference.
  hypothesis: Cache-aware/workload-aware routing can improve ttft, throughput, cache_hit_rate
    only if its mechanism is instrumented and protected quality gates pass.
  primary_metrics:
  - routing_decision
  - cache_affinity_key
  - route_level_latency
  secondary_metrics:
  - route_level_cost
  - route_level_quality
  protected_quality_safety_metrics:
  - json_validity
  - contract_validity
  - format_validity
  - evidence_match
  - groundedness
  - safety_findings
  - truncation
  - completion_failure_rate
  required_instrumentation:
  - routing_decision
  - selected_route_model_engine
  - decision_reason
  - prompt_length_bucket
  - vertical
  - complexity_class
  - expected_status
  - cache_affinity_key
  - session_affinity
  - queue_depth
  - estimated_cost
  - predicted_latency
  - fallback_escalation_route
  - routing_success_failure
  - route_level_quality
  - route_level_latency
  - route_level_cost
  optional_instrumentation:
  - policy simulation trace
  existing_instrumentation:
  - vertical
  - prompt length aggregates
  - route comparison CSVs
  missing_instrumentation:
  - routing decision trace
  - cache-affinity key
  - queue-depth input
  derivation_method: Historical route comparisons can inform planning but not route
    decisions.
  sampling_frequency: per request routing decision
  temporal_resolution: per request and route aggregate
  aggregation_levels:
  - per_run
  - per_config
  - per_engine
  - per_memory_mode
  - per_vertical
  - per_route
  - per_complexity_class
  engine_specific_fields:
    vllm:
      ttft_ms: available_from_existing_eval_aggregates
      gpu_utilization_percent: available_from_saved_gpu_telemetry
      prefix_cache_hit_count: requires_engine_metrics_or_wrapper
      kv_blocks_used: requires_engine_metrics
      active_batch_size: requires_wrapper_or_engine_iteration_logs
      chunked_prefill_state: startup_flag_missing
      speculative_acceptance_rate: unavailable_without_speculative_run
    sglang:
      ttft_ms: available_from_existing_eval_aggregates
      gpu_utilization_percent: available_from_saved_gpu_telemetry
      radixattention_cache_metrics: requires_runtime_logs_or_metrics
      kv_blocks_used: requires_engine_metrics
      active_batch_size: requires_wrapper_or_scheduler_logs
      chunked_prefill_state: startup_flag_missing
      speculative_acceptance_rate: unavailable_without_speculative_run
    api_provider_route:
      ttft_ms: available_from_existing_eval_aggregates
      api_cost_usd: available_from_cost_report
      gpu_utilization_percent: not_applicable_provider_managed
      prefix_cache_hit_count: unavailable_provider_hidden
      kv_blocks_used: unavailable_provider_hidden
  model_specific_fields:
    model3_7b:
    - tokenizer_name
    - model_id
    model6_gated:
    - api_provider_route
  device_requirements:
  - a100_sxm_80gb
  external_profiler_requirements: []
  experiment_type: planned_policy_simulation_then_measured_rerun
  ui_visualization_contract:
    visualizations:
    - routing_map
    - cache_affinity_clusters
    - route_cost_latency_quality
    state_labels:
    - instrumented
    - partially_instrumented
    - instrumentation_missing
    - planned
    - measured
    - unavailable
    - future
    measurement_labels_required: true
  acceptance_evidence:
  - route improves latency/cost while protected metrics pass
  rejection_evidence:
  - routing harms quality or creates unfair route drift
  instrumentation_readiness_state: requires_runner_instrumentation
  instrumentation_readiness_state_does_not_unblock_optimization: true
- optimization_id: chunked_prefill_tuning
  display_name: Chunked-prefill tuning
  optimization_domain: prefill_decode_balance
  difficulty_tier: 1
  problem_statement: Long context can increase TTFT and interfere with decode work
    if prefill is not balanced.
  mechanism: Interleave long-prefill requests with decode work.
  hypothesis: If long prefills are chunked appropriately, long-request TTFT improves
    while decode continues for shorter requests.
  primary_metrics:
  - ttft_by_input_length_bucket
  - chunk_count
  - decode_interference
  secondary_metrics:
  - tpot_by_input_length_bucket
  - e2e_latency_by_input_length_bucket
  protected_quality_safety_metrics:
  - json_validity
  - contract_validity
  - format_validity
  - evidence_match
  - groundedness
  - safety_findings
  - truncation
  - completion_failure_rate
  required_instrumentation:
  - chunked_prefill_enabled
  - configured_chunk_size
  - actual_chunk_count
  - tokens_per_chunk
  - maximum_partial_prefills
  - long_prompt_threshold
  - prefill_token_budget
  - prefill_queue_delay_ms
  - short_request_bypass_behavior
  - decode_interference
  - ttft_by_input_length_bucket
  - tpot_by_input_length_bucket
  - e2e_by_input_length_bucket
  - head_of_line_blocking_indicators
  - short_long_request_co_residency
  - engine_iteration_composition
  optional_instrumentation:
  - engine debug traces
  existing_instrumentation:
  - input token aggregate by config
  - TTFT aggregate by config
  missing_instrumentation:
  - chunk counters
  - iteration composition
  - short/long co-residency
  derivation_method: Length-bucket opportunity can be estimated; chunk events cannot.
  sampling_frequency: per request and per engine iteration
  temporal_resolution: request length bucket and scheduler iteration
  aggregation_levels:
  - per_run
  - per_config
  - per_engine
  - per_memory_mode
  - per_vertical
  - per_prompt_length_bucket
  - per_prefix_family
  engine_specific_fields:
    vllm:
      chunked_prefill_enabled: startup flag plus engine iteration metrics
    sglang:
      chunked_prefill_enabled: startup flag plus chunk counters
  model_specific_fields:
    model3_7b:
    - tokenizer_name
    - model_id
    model6_gated:
    - api_provider_route
  device_requirements:
  - a100_sxm_80gb
  external_profiler_requirements: []
  experiment_type: gpu_one_factor_engine_config
  ui_visualization_contract:
    visualizations:
    - long_prompt_chunks
    - concurrent_decode_work
    - ttft_by_length_bucket
    state_labels:
    - instrumented
    - partially_instrumented
    - instrumentation_missing
    - planned
    - measured
    - unavailable
    - future
    measurement_labels_required: true
  acceptance_evidence:
  - long-prompt TTFT improves without short-request regression
  rejection_evidence:
  - decode interference increases
  - tail latency worsens
  instrumentation_readiness_state: requires_engine_metrics
  instrumentation_readiness_state_does_not_unblock_optimization: true
