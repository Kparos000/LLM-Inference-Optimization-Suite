- optimization_id: scheduler_batch_tuning
  display_name: Scheduler and batch tuning
  optimization_domain: scheduler_batching
  difficulty_tier: 1
  problem_statement: Configured concurrency does not prove actual batch composition
    or scheduler efficiency.
  mechanism: Balance queueing, prefill, decode, and batch composition.
  hypothesis: If queueing and batch budgets are tuned from observed scheduler metrics,
    throughput can improve without tail-latency regression.
  primary_metrics:
  - queue_wait_ms
  - active_batch_size
  - token_budget_utilization
  secondary_metrics:
  - ttft_ms
  - e2e_latency_ms
  - tokens_per_second
  protected_quality_safety_metrics:
  - json_validity
  - contract_validity
  - format_validity
  - evidence_match
  - groundedness
  - safety_findings
  - truncation
  - completion_failure_rate
  required_instrumentation:
  - request_arrival_time
  - queue_wait_ms
  - waiting_request_count
  - running_request_count
  - active_batch_size
  - batch_composition
  - scheduled_tokens
  - maximum_token_budget
  - prefill_tokens_per_iteration
  - decode_tokens_per_iteration
  - maximum_running_sequences
  - maximum_batched_tokens
  - admission_decision
  - preemption_count
  - preemption_reason
  - recomputation_count
  - scheduling_policy
  - priority_class
  - batch_waiting_delay_ms
  - iteration_duration_ms
  - gpu_busy_idle_interval
  optional_instrumentation:
  - engine metrics endpoint
  - scheduler debug logs
  existing_instrumentation:
  - configured concurrency
  - aggregate latency
  - aggregate throughput
  missing_instrumentation:
  - actual active batch size
  - queue wait
  - engine iteration counters
  derivation_method: Configured concurrency is available but is not active batch size.
  sampling_frequency: per request and per engine iteration
  temporal_resolution: request lifecycle and scheduler iteration
  aggregation_levels:
  - per_run
  - per_config
  - per_engine
  - per_memory_mode
  - per_vertical
  - per_request
  - per_engine_iteration
  - per_concurrency_level
  engine_specific_fields:
    vllm:
      active_batch_size: requires scheduler/iteration telemetry
      max_num_seqs: startup/runtime config field
      max_num_batched_tokens: startup/runtime config field
    sglang:
      running_waiting_requests: requires scheduler logs
      batch_waiting_delay: runtime config and observed queue timing
  model_specific_fields:
    model3_7b:
    - tokenizer_name
    - model_id
    model6_gated:
    - api_provider_route
  device_requirements:
  - a100_sxm_80gb
  external_profiler_requirements: []
  experiment_type: gpu_one_factor_runtime_config
  ui_visualization_contract:
    visualizations:
    - queue_animation
    - active_batch
    - token_budget_utilization
    state_labels:
    - instrumented
    - partially_instrumented
    - instrumentation_missing
    - planned
    - measured
    - unavailable
    - future
    measurement_labels_required: true
  acceptance_evidence:
  - higher throughput without tail latency or quality regression
  rejection_evidence:
  - p95/p99 latency regression
  - OOM
  - preemption spikes
  instrumentation_readiness_state: requires_runner_instrumentation
  instrumentation_readiness_state_does_not_unblock_optimization: true
- optimization_id: speculative_decoding
  display_name: Speculative decoding
  optimization_domain: speculative_decoding
  difficulty_tier: 2
  problem_statement: Decode speed may improve with a draft model, but no speculation
    support or telemetry exists.
  mechanism: Reduce target-model decode work when draft tokens are accepted.
  hypothesis: Speculative decoding can improve tpot, throughput, e2e_latency only
    if its mechanism is instrumented and protected quality gates pass.
  primary_metrics:
  - acceptance_rate
  - accepted_tokens_per_target_pass
  - tpot_ms
  secondary_metrics:
  - additional_vram
  - draft_latency
  - throughput
  protected_quality_safety_metrics:
  - json_validity
  - contract_validity
  - format_validity
  - evidence_match
  - groundedness
  - safety_findings
  - truncation
  - completion_failure_rate
  required_instrumentation:
  - target_model
  - draft_model
  - speculation_method
  - drafted_tokens
  - accepted_tokens
  - rejected_tokens
  - acceptance_rate
  - accepted_tokens_per_target_pass
  - draft_latency_ms
  - target_verification_latency_ms
  - speculation_depth
  - draft_token_count
  - additional_vram_mb
  - draft_model_memory_mb
  - tpot_itl_change
  - throughput_change
  - concurrency_effect
  - quality_safety_protections
  - automatic_disable_reason
  optional_instrumentation:
  - engine speculation counters
  existing_instrumentation:
  - none
  missing_instrumentation:
  - draft model
  - accept/reject telemetry
  - verification latency
  derivation_method: Speculation acceptance cannot exist without a speculative run.
  sampling_frequency: per decode verification step
  temporal_resolution: per request and token verification step
  aggregation_levels:
  - per_run
  - per_config
  - per_engine
  - per_memory_mode
  - per_vertical
  engine_specific_fields:
    vllm:
      ttft_ms: available_from_existing_eval_aggregates
      gpu_utilization_percent: available_from_saved_gpu_telemetry
      prefix_cache_hit_count: requires_engine_metrics_or_wrapper
      kv_blocks_used: requires_engine_metrics
      active_batch_size: requires_wrapper_or_engine_iteration_logs
      chunked_prefill_state: startup_flag_missing
      speculative_acceptance_rate: unavailable_without_speculative_run
    sglang:
      ttft_ms: available_from_existing_eval_aggregates
      gpu_utilization_percent: available_from_saved_gpu_telemetry
      radixattention_cache_metrics: requires_runtime_logs_or_metrics
      kv_blocks_used: requires_engine_metrics
      active_batch_size: requires_wrapper_or_scheduler_logs
      chunked_prefill_state: startup_flag_missing
      speculative_acceptance_rate: unavailable_without_speculative_run
    api_provider_route:
      ttft_ms: available_from_existing_eval_aggregates
      api_cost_usd: available_from_cost_report
      gpu_utilization_percent: not_applicable_provider_managed
      prefix_cache_hit_count: unavailable_provider_hidden
      kv_blocks_used: unavailable_provider_hidden
  model_specific_fields:
    target_model: model3_7b
    draft_model: must be explicitly selected before experiment
  device_requirements:
  - a100_sxm_80gb
  external_profiler_requirements: []
  experiment_type: future_gpu_engine_config
  ui_visualization_contract:
    visualizations:
    - draft_tokens
    - accepted_rejected_tokens
    - acceptance_rate
    state_labels:
    - instrumented
    - partially_instrumented
    - instrumentation_missing
    - planned
    - measured
    - unavailable
    - future
    measurement_labels_required: true
  acceptance_evidence:
  - high acceptance rate and TPOT improvement with protected quality
  rejection_evidence:
  - low acceptance rate
  - extra VRAM/cost outweighs gains
  instrumentation_readiness_state: unsupported_current_runtime
  instrumentation_readiness_state_does_not_unblock_optimization: true
