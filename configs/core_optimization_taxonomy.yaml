  B_engineer_applied_core_optimizations:
  - optimization_id: prompt_prefix_layout_optimization
    display_name: Prompt and prefix-layout optimization
    difficulty_tier: 1
    category: workload_and_configuration
    definition: Move stable instructions, schema, and reusable scaffolding into identical
      leading token spans without changing the answer contract.
    mechanism: Increase token-identical leading prefix length for cacheability.
    implementation_mechanism:
    - code_change
    - workload_change
    target_metrics:
    - ttft
    - prefill_time
    - tokens_per_second
    protected_metrics:
    - json_validity
    - contract_validity
    - format_validity
    - evidence_match
    - groundedness
    - safety_findings
    - truncation
    - completion_failure_rate
    prerequisites:
    - rendered prompt diff
    - no gold leakage check
    engine_compatibility:
    - vllm
    - sglang
    - api_provider_route
    model_compatibility:
    - model3_7b
    - model6_gated
    hardware_compatibility:
    - a100_sxm_80gb
    - provider_managed
    baseline_state: not_applied_as_project_optimization
    already_active: false
    negative_rules:
    - context_compression
    risks:
    - accidental contract change
    - lower evidence clarity
    expected_telemetry:
    - exact_reusable_prefix_tokens
    - prompt_token_distribution
    one_factor_experiment_design: Change prompt layout only; keep context and model
      fixed.
    gpu_api_cpu_requirements: CPU for static diff; GPU/API only for measured latency.
    result_availability: planned
    ui_visualization_concept: Prefix waterfall showing fixed vs per-request token
      spans.
    future_paper_evidence_required: Prefix-cache and prompt-layout literature review.
    source_catalog_ids:
    - reduce_context_tokens
